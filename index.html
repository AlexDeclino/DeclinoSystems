<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declino Systems</title>
  <style>
    * {
      font-family: monospace;
      padding: 0;
      line-height: 1.3rem;
    }

    body {
      margin: 8px;
      background-color: #ffffff;
      color: #111111;
    }

    h2 {
      margin-left: 0.83em;
    }

    .version {
      font-size: 0.75rem;
      font-weight: normal;
      color: #666;
    }

    .quote-line {
      margin-left: calc(2 * 0.83em);
      font-size: 0.85rem;
      color: #666;
    }

    a {
      color: red;
    }

    a:visited {
      color: #990000;
    }

    .contacts {
      margin-left: calc(2 * 0.83em);
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #ccc;
      font-size: 0.85rem;
      max-width: 400px;
    }

    @media (max-width: 480px) {
      h2 {
        margin-left: 0;
      }
      .quote-line {
        margin-left: 0;
      }
      .contacts {
        margin-left: 0;
        max-width: none;
        width: auto;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111111;
        color: #eeeeee;
      }
      .quote-line {
        color: #888;
      }
      .version {
        color: #888;
      }
      .contacts {
        border-color: #333;
      }
    }

    @media (prefers-color-scheme: light) {
      body {
        background-color: #ffffff;
        color: #111111;
      }
    }


  </style>
</head>
<body>
  <h2>DECLINO SYSTEMS <span class="version">v.0.0.0</span></h2>
  <div class="quote-line" style="margin-top: 1.3rem;"><a href="https://instagram.com/alexdeclino" target="_blank" style="color: #FFD700;">@alexdeclino</a></div>
  <div class="quote-line"><a href="https://instagram.com/sybil.gg" target="_blank" style="color: #FFD700;">@sybil.gg</a></div>
  <div class="quote-line" style="margin-top: 1.3rem;">(under construction)</div>

  <div class="quote-line" style="margin-top: 1.3rem;">upcoming events:</div>
  <ul id="events" class="quote-line" style="list-style: disc; padding-left: 2.5em; margin-top: 0.3rem;"></ul>

  <script>
    fetch('events.json')
      .then(r => r.json())
      .then(events => {
        const ul = document.getElementById('events');
        events.forEach(e => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = e.link;
          a.target = '_blank';
          a.textContent = `${e.name} at ${e.location}, ${e.date}, ${e.city}`;
          li.appendChild(a);
          ul.appendChild(li);
        });
      });
  </script>

  <script>
    const QUOTES_BASE = 'https://api.are.na/v2/channels/npc-dialogues';
    let texts = [];

    async function fetchQuotes() {
      try {
        let page = 1;
        let totalPages = 1;
        const all = [];

        do {
          const res = await fetch(`${QUOTES_BASE}?per=100&page=${page}`);
          const data = await res.json();
          totalPages = data.total_pages || 1;
          all.push(...data.contents);
          page++;
        } while (page <= totalPages);

        texts = all
          .filter(b => b.class === 'Text')
          .map(b => b.content.trim())
          .filter(t => t.length > 0);
      } catch (e) {
        console.error('arena fetch failed', e);
      }
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    const WORD_MS = 600;
    const DOT_MS = WORD_MS / 2;

    async function runLoop() {
      await fetchQuotes();
      if (texts.length === 0) return;

      while (true) {
        const sentence = texts[Math.floor(Math.random() * texts.length)];
        const words = sentence.split(/\s+/).filter(w => w.length > 0);

        for (const word of words) {
          const clean = word.replace(/[^a-zA-Z0-9]/g, '');
          if (!clean) continue;
          history.replaceState(null, '', '#' + clean);
          await sleep(WORD_MS);
        }

        for (let i = 1; i <= 10; i++) {
          history.replaceState(null, '', '#' + '.'.repeat(i));
          await sleep(DOT_MS);
        }
      }
    }

    runLoop();
  </script>
</body>
</html>
