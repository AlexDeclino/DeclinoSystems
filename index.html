<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declino Systems</title>
  <style>
    * {
      font-family: monospace;
      padding: 0;
      line-height: 1.3rem;
    }

    body {
      margin: 8px;
      background-color: #ffffff;
      color: #111111;
    }

    h2 {
      margin-left: 0.83em;
    }

    .version {
      font-size: 0.75rem;
      font-weight: normal;
      color: #666;
    }

    .quote-line {
      margin-left: calc(2 * 0.83em);
      font-size: 0.85rem;
      color: #666;
    }

    a {
      color: red;
    }

    a:visited {
      color: #990000;
    }

    .contacts {
      margin-left: calc(2 * 0.83em);
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #ccc;
      font-size: 0.85rem;
      max-width: 400px;
    }

    @media (max-width: 480px) {
      h2 {
        margin-left: 0;
      }
      .quote-line {
        margin-left: 0;
      }
      .contacts {
        margin-left: 0;
        max-width: none;
        width: auto;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111111;
        color: #eeeeee;
      }
      .quote-line {
        color: #888;
      }
      .version {
        color: #888;
      }
      .contacts {
        border-color: #333;
      }
    }

    @media (prefers-color-scheme: light) {
      body {
        background-color: #ffffff;
        color: #111111;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #fill {
      white-space: pre;
      font-size: 0.85rem;
      line-height: 1.3rem;
      color: #111;
      padding: 4px;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      #fill {
        color: #eeeeee;
      }
    }
  </style>
</head>
<body>
  <div id="fill"></div>
  <script>
    const TEXT = 'DECLINO SYSTEMS v.0.0.0 ';
    const el = document.getElementById('fill');
    const charW = 8;
    const lineH = 20;
    const cols = Math.ceil(window.innerWidth / charW);
    const rows = Math.ceil(window.innerHeight / lineH);
    const line = TEXT.repeat(Math.ceil((cols * charW) / (TEXT.length * charW)) + 1);
    el.textContent = (line + '\n').repeat(rows);
  </script>

  <script>
    const QUOTES_API = 'https://api.are.na/v2/channels/npc-dialogues?per=100';
    let texts = [];

    async function fetchQuotes() {
      try {
        const res = await fetch(QUOTES_API);
        const data = await res.json();
        texts = data.contents
          .filter(b => b.class === 'Text')
          .map(b => b.content.trim())
          .filter(t => t.length > 0);
      } catch (e) {
        console.error('arena fetch failed', e);
      }
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function runLoop() {
      await fetchQuotes();
      if (texts.length === 0) return;

      while (true) {
        const sentence = texts[Math.floor(Math.random() * texts.length)];
        const words = sentence.split(/\s+/).filter(w => w.length > 0);

        for (const word of words) {
          history.replaceState(null, '', '#' + encodeURIComponent(word));
          await sleep(500);
        }

        history.replaceState(null, '', ' ');
        await sleep(3000);
      }
    }

    runLoop();
  </script>
</body>
</html>
