<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — Declino Systems</title>
  <style>
    * {
      font-family: monospace;
      padding: 0;
      line-height: 1.3rem;
    }

    body {
      margin: 8px;
      background-color: #ffffff;
      color: #111111;
    }

    h2 {
      margin-left: 0.83em;
    }

    .version {
      font-size: 0.75rem;
      font-weight: normal;
      color: #666;
    }

    .line {
      margin-left: calc(2 * 0.83em);
      font-size: 0.85rem;
      color: #666;
    }

    a {
      color: red;
    }

    a:visited {
      color: #990000;
    }

    ul.notes-list {
      list-style: disc;
      padding-left: 2.5em;
      margin-top: 0.3rem;
    }

    ul.notes-list li {
      margin-bottom: 0.1rem;
    }

    @media (max-width: 480px) {
      h2 { margin-left: 0; }
      .line { margin-left: 0; }
    }

    @media (prefers-color-scheme: dark) {
      body { background-color: #111111; color: #eeeeee; }
      .line { color: #888; }
      .version { color: #888; }
    }

    @media (prefers-color-scheme: light) {
      body { background-color: #ffffff; color: #111111; }
    }
  </style>
</head>
<body>
  <h2>DECLINO SYSTEMS <span class="version">v.0.0.0</span></h2>
  <div class="line" style="margin-top: 1.3rem;"><a href="/">← home</a></div>

  <div class="line" style="margin-top: 1.3rem;">notes:</div>
  <ul id="notes-list" class="notes-list line"></ul>

  <script>
    fetch('manifest.json')
      .then(r => r.text())
      .then(t => JSON.parse(t.replace(/,\s*]/g, ']')))
      .then(slugs => Promise.all(
        slugs.map(slug =>
          fetch(`${slug}.md`)
            .then(r => r.text())
            .then(text => {
              const lines = text.split('\n');
              const title = lines[0].trim();
              const dateStr = lines[1].trim();
              return { slug, title, dateStr, date: new Date(dateStr) };
            })
        )
      ))
      .then(notes => {
        notes.sort((a, b) => a.date - b.date);
        const ul = document.getElementById('notes-list');
        notes.forEach(n => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = `note.html?note=${n.slug}`;
          a.textContent = n.title;
          li.appendChild(a);
          li.appendChild(document.createTextNode(` — ${n.dateStr}`));
          ul.appendChild(li);
        });
      });
  </script>
</body>
</html>
