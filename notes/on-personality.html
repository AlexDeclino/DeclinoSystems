<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On Personality — Declino Systems</title>
  <style>
    * {
      font-family: monospace;
      padding: 0;
      line-height: 1.3rem;
    }

    body {
      margin: 8px;
      background-color: #ffffff;
      color: #111111;
    }

    h2 {
      margin-left: 0.83em;
    }

    .version {
      font-size: 0.75rem;
      font-weight: normal;
      color: #666;
    }

    .line {
      margin-left: calc(2 * 0.83em);
      font-size: 0.85rem;
      color: #666;
    }

    .note-body {
      margin-left: calc(2 * 0.83em);
      margin-top: 1.3rem;
      font-size: 0.85rem;
      max-width: 600px;
    }

    a {
      color: red;
    }

    a:visited {
      color: #990000;
    }

    @media (max-width: 480px) {
      h2 {
        margin-left: 0;
      }
      .line {
        margin-left: 0;
      }
      .note-body {
        margin-left: 0;
        max-width: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111111;
        color: #eeeeee;
      }
      .line {
        color: #888;
      }
      .version {
        color: #888;
      }
    }

    @media (prefers-color-scheme: light) {
      body {
        background-color: #ffffff;
        color: #111111;
      }
    }
  </style>
</head>
<body>
  <h2>DECLINO SYSTEMS <span class="version">v.0.0.0</span></h2>
  <div class="line" style="margin-top: 1.3rem;"><a href="/notes">← notes</a></div>
