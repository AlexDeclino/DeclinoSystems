<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note — Declino Systems</title>
  <style>
    * {
      font-family: monospace;
      padding: 0;
      line-height: 1.3rem;
    }

    body {
      margin: 8px;
      background-color: #ffffff;
      color: #111111;
    }

    h2 {
      margin-left: 0.83em;
    }

    .version {
      font-size: 0.75rem;
      font-weight: normal;
      color: #666;
    }

    .line {
      margin-left: calc(2 * 0.83em);
      font-size: 0.85rem;
      color: #666;
    }

    .note-body {
      margin-left: calc(2 * 0.83em);
      margin-top: 1.3rem;
      font-size: 0.85rem;
      max-width: 600px;
      color: #111111;
    }

    .note-body p {
      margin-bottom: 1rem;
    }

    mark {
      background-color: #FFD700;
      color: #111111;
      padding: 0 0.1em;
    }

    a {
      color: red;
    }

    a:visited {
      color: #990000;
    }

    @media (max-width: 480px) {
      h2 { margin-left: 0; }
      .line { margin-left: 0; }
      .note-body { margin-left: 0; max-width: none; }
    }

    @media (prefers-color-scheme: dark) {
      body { background-color: #111111; color: #eeeeee; }
      .line { color: #888; }
      .version { color: #888; }
      .note-body { color: #eeeeee; }
    }

    @media (prefers-color-scheme: light) {
      body { background-color: #ffffff; color: #111111; }
    }
  </style>
</head>
<body>
  <h2 id="channel-title"></h2>
  <div id="back-link" class="line" style="margin-top: 1.3rem;"></div>

  <div id="note-header" class="line" style="margin-top: 1.3rem;"></div>
  <div id="note-body" class="note-body"></div>

  <script>
    function renderMarkdown(text) {
      return text
        .split(/\n\n+/)
        .map(para => {
          para = para.trim();
          if (!para) return '';
          para = para
            .replace(/\*\*\*(.+?)\*\*\*/g, '<mark>$1</mark>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>');
          return `<p>${para.replace(/\n/g, '<br>')}</p>`;
        })
        .join('');
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const channelSlug = params.get('channel');
    const backLink = document.getElementById('back-link');
    const a = document.createElement('a');
    a.href = channelSlug ? `channel.html?slug=${channelSlug}` : '/notes';
    a.textContent = '← notes';
    backLink.appendChild(a);

    if (id) {
      fetch(`https://api.are.na/v2/blocks/${id}`)
        .then(r => r.json())
        .then(block => {
          const lines = (block.content || '').split('\n');
          const title = lines[0].trim();
          const body = lines.slice(1).join('\n').trim();
          const dateStr = new Date(block.created_at).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
          const channelTitle = (block.channels && block.channels[0]) ? block.channels[0].title : '';
          document.title = `${title} — ${channelTitle}`;
          document.getElementById('channel-title').textContent = channelTitle;
          document.getElementById('note-header').textContent = `${title} — ${dateStr}`;
          document.getElementById('note-body').innerHTML = renderMarkdown(body);
        });
    }
  </script>
</body>
</html>
